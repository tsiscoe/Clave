[package]
name = "loom-scrubber"
version = "0.1.0"
edition = "2024"
authors = ["tsiscoe <tsiscoe@users.noreply.github.com>"]
description = "Loom: Bidirectional Format-Preserving Cryptographic PII, IP & Secret Pseudonymizer for LLMs, Logs, and Codebases"
license = "MIT"
repository = "https://github.com/tsiscoe/Loom"
readme = "README.md"
keywords = ["cryptography", "privacy", "pseudonymization", "fpe", "tui"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[[bin]]
name = "loom"
path = "src/main.rs"

[lib]
name = "loom_scrubber"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography (Argon2id + HKDF-SHA256 + BLAKE3 PRF + XChaCha20-Poly1305 + Zeroize)
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"

# Storage (SQLite WAL mode bundled >= 3.51.2 for CVE-2026-119375)
rusqlite = { version = "0.42.0", features = ["bundled"] }

# SIMD Pattern Recognition & Git-Aware Directory Traversal
aho-corasick = "1.1"
regex = "1.11"
ignore = "0.4"

# TUI (Ratatui v0.30+ & Crossterm)
ratatui = "0.30"
crossterm = "0.28"

# Clipboard & OS Keyring (Pure-Rust Linux keyutils)
arboard = "3.4"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
rpassword = "7.3"

[dev-dependencies]
tempfile = "3.14"
proptest = "1.5"

[lints.rust]
unsafe_code = "forbid"
